name: Rust checks
on: [push, pull_request]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows-x64
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: macos-15
            platform: macos-arm64
          - runner: macos-15-intel
            platform: macos-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux development libraries
        if: runner.os == 'Linux'
        run: |
          libraries=(pkg-config libssl-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxkbcommon-dev libwayland-dev libasound2-dev ffmpeg)
          if ! sudo apt-get install -y --no-install-recommends "${libraries[@]}"; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${libraries[@]}"
          fi
      - name: FFmpeg for UI wiring checks on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg --no-progress -y }
      - name: FFmpeg for Apple Silicon media checks
        if: runner.os == 'macOS' && runner.arch == 'ARM64'
        run: |
          if ! command -v ffmpeg >/dev/null; then
            brew install ffmpeg@8
            echo "$(brew --prefix ffmpeg@8)/bin" >> "$GITHUB_PATH"
          fi
      - name: Verified FFmpeg for Intel macOS media checks
        if: runner.os == 'macOS' && runner.arch == 'X64'
        run: |
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/pixclip-media"
          cd "$RUNNER_TEMP/pixclip-media"
          base="https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1"
          curl --fail --silent --show-error --location --retry 2 -O "$base/ffmpeg-darwin-x64.gz"
          curl --fail --silent --show-error --location --retry 2 -O "$base/ffprobe-darwin-x64.gz"
          printf '%s\n' \
            '929b375c1182d956c51f7ac25e0b2b0411fb01f6f407aa15c9758efeb4242106  ffmpeg-darwin-x64.gz' \
            'd4da574d6e2e197bd259b47d69cf262df9e312af24ad960444f6d806d3d4c186  ffprobe-darwin-x64.gz' \
            | shasum -a 256 -c -
          gzip -dc ffmpeg-darwin-x64.gz > ffmpeg
          gzip -dc ffprobe-darwin-x64.gz > ffprobe
          chmod +x ffmpeg ffprobe
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Test Unix app update helper with simulated installers
        if: runner.os != 'Windows'
        run: python3 scripts/test-unix-update.py
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Build and validate native archive
        if: runner.os != 'Windows'
        env:
          PIXCLIP_STATE_DIR: ${{ runner.temp }}/pixclip-release-state
        run: |
          bash scripts/package-unix.sh
          mkdir -p "$RUNNER_TEMP/pixclip-smoke"
          tar -xzf dist/PixClip-*.tar.gz -C "$RUNNER_TEMP/pixclip-smoke"
          "$RUNNER_TEMP/pixclip-smoke/PixClip/PixClip" --compatibility-test
      - uses: actions/upload-artifact@v4
        with:
          name: pixclip-${{ matrix.platform }}
          path: |
            target/release/pixclip.exe
            dist/PixClip-*.tar.gz
          if-no-files-found: error
