app-id: io.github.PeakNAtanon.PixClip
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: pixclip
rename-desktop-file: pixclip.desktop
rename-icon: pixclip
finish-args:
  # Required to run the host Flatpak installer after the app exits.
  - --talk-name=org.freedesktop.Flatpak
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-download
  - --filesystem=xdg-music
  - --filesystem=xdg-videos
build-options:
  prepend-path: /usr/lib/sdk/rust-stable/bin
  append-ld-library-path: /usr/lib/sdk/rust-stable/lib
  env:
    CARGO_HOME: /run/build/pixclip/cargo-home
cleanup:
  - /include
  - /lib/pkgconfig
  - '*.a'
modules:
  - name: x264
    buildsystem: simple
    build-commands:
      - ./configure --prefix=/app --enable-shared --disable-static --disable-cli
      - make -j "$FLATPAK_BUILDER_N_JOBS"
      - make install
      - install -Dm644 COPYING /app/share/licenses/x264/COPYING
    sources:
      - type: git
        url: https://github.com/mirror/x264.git
        commit: 31e19f92f00c7003fa115047ce50978bc98c3a0d
  - name: lame
    buildsystem: autotools
    no-autogen: true
    config-opts:
      - --disable-static
      - --enable-shared
      - --disable-frontend
    post-install:
      - install -Dm644 COPYING /app/share/licenses/lame/COPYING
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz
        sha256: ddfe36cab873794038ae2c1210557ad34857a4b6bdc515785d1da9e175b1da1e
  - name: ffmpeg
    buildsystem: simple
    build-commands:
      - ./configure --prefix=/app --enable-gpl --enable-version3 --enable-libx264 --enable-libmp3lame --enable-openssl --disable-doc --disable-debug --disable-ffplay
      - make -j "$FLATPAK_BUILDER_N_JOBS"
      - make install
      - install -Dm644 COPYING.GPLv3 /app/share/licenses/ffmpeg/COPYING.GPLv3
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-8.1.3.tar.xz
        sha256: 7138d28c96d9d3e3af4ee3d8cad72741f8ffb40da90c1112235dea3ecd3178a3
  - name: media-downloaders
    buildsystem: simple
    build-commands:
      - install -Dm755 yt-dlp /app/bin/yt-dlp
      - install -Dm755 streamlink.AppImage /app/libexec/streamlink.AppImage
      - install -Dm755 streamlink /app/bin/streamlink
    sources:
      - type: file
        url: https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.26/yt-dlp_linux
        sha256: 767ba9dce7052aa196f8b12652f433d76de128ba168966fa84b6394d5e6c6795
        dest-filename: yt-dlp
      - type: file
        url: https://github.com/streamlink/streamlink-appimage/releases/download/8.6.3-1/streamlink-8.6.3-1-cp315-cp315-manylinux_2_28_x86_64.AppImage
        sha256: ccee9ba370c607330a1c9fb7fd645c63972cc6cf7dda206ec9fc2c22e994429a
        dest-filename: streamlink.AppImage
      - type: file
        path: streamlink
  - name: pixclip
    buildsystem: simple
    build-commands:
      - cargo build --release --frozen --offline
      - install -Dm755 target/release/pixclip /app/bin/pixclip-bin
      - install -Dm755 scripts/linux/flatpak/pixclip /app/bin/pixclip
      - install -Dm644 scripts/linux/pixclip.desktop /app/share/applications/pixclip.desktop
      - install -Dm644 assets/pixclip-icon.png /app/share/icons/hicolor/256x256/apps/pixclip.png
      - install -Dm644 scripts/linux/flatpak/io.github.PeakNAtanon.PixClip.metainfo.xml /app/share/metainfo/io.github.PeakNAtanon.PixClip.metainfo.xml
      - install -Dm644 LICENSE /app/share/licenses/pixclip/LICENSE
      - install -Dm644 assets/fonts/OFL.txt /app/share/licenses/pixclip/LICENSE-NotoSansThai.txt
      - install -Dm644 docs/README-PixClip.md /app/share/doc/pixclip/README-PixClip.md
    sources:
      # release.yml exports the tagged source and vendors Cargo.lock dependencies here.
      - type: dir
        path: ../../../.cache/flatpak-source
